<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibliothèque interactive — ARGOS 42</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --caramel: #a4470e;
      --caramel-dark: #823608;
      --beige: #e2d6c5;
      --discret: #f7f4f2;
      --chocolat: #372612;
      --chocolat-soft: #6b533b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--discret);
      color: var(--chocolat);
      padding: 24px 16px 60px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }

    header {
      background: #fff;
      border: 2px solid var(--caramel);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      font-family: 'Kaushan Script', cursive;
      font-size: 1.95rem;
      font-weight: 400;
      color: var(--caramel);
    }
    .sub { font-size: 0.9rem; color: var(--chocolat-soft); margin-top: 4px; }
    .auto-badge {
      background: var(--beige);
      color: var(--caramel);
      border: 1px solid var(--caramel);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 50px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--beige);
      border-radius: 50px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 18px;
      background: #fff;
      color: var(--chocolat);
      outline: none;
    }
    .search-bar:focus { border-color: var(--caramel); }

    .list { display: grid; gap: 12px; }

    .item {
      background: #fff;
      border: 1.5px solid var(--beige);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .item-info { flex: 1 1 260px; }
    .item-title {
      font-weight: 700;
      font-size: 1.02rem;
      color: var(--chocolat);
      text-transform: capitalize;
    }
    .item-file {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--chocolat-soft);
      margin-top: 2px;
    }

    .item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    select {
      padding: 8px 10px;
      border-radius: 50px;
      border: 1.5px solid var(--beige);
      background: var(--discret);
      font-family: 'Roboto', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--chocolat);
      cursor: pointer;
    }
    .btn {
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 8px 15px;
      border-radius: 50px;
      border: 1.5px solid var(--caramel);
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-copy { background: var(--caramel); color: #fff; }
    .btn-copy:hover { background: var(--caramel-dark); }
    .btn-copy.ok { background: #2e6f40; border-color: #2e6f40; }
    .btn-open { background: #fff; color: var(--caramel); }
    .btn-open:hover { background: var(--beige); }

    .status {
      text-align: center;
      padding: 30px;
      color: var(--chocolat-soft);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Modules interactifs ARGOS 42</h1>
      <p class="sub">Tous vos fichiers GitHub détectés automatiquement • Prêts à coller dans WordPress.</p>
    </div>
    <span class="auto-badge">⚡ Synchronisation auto</span>
  </header>

  <input type="text" id="search" class="search-bar" placeholder="🔍 Rechercher un module (ex : vienne, biglou, halloween, quiz...)" oninput="filterList()" />

  <div id="list" class="list">
    <div class="status">Chargement automatique des fichiers depuis GitHub...</div>
  </div>
</div>

<script>
  const USER = 'argos42391';
  const REPO = 'article-argos42';
  const BASE_URL = `https://${USER}.github.io/${REPO}/`;

  function formatName(filename) {
    return filename
      .replace('.html', '')
      .replace(/[-_]/g, ' ');
  }

  async function loadFiles() {
    const listEl = document.getElementById('list');
    try {
      const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/`);
      if (!res.ok) throw new Error('Erreur API GitHub');
      const files = await res.json();

      const htmlFiles = files.filter(f =>
        f.type === 'file' &&
        f.name.endsWith('.html') &&
        f.name.toLowerCase() !== 'index.html'
      );

      if (htmlFiles.length === 0) {
        listEl.innerHTML = '<div class="status">Aucun fichier .html trouvé dans le dépôt.</div>';
        return;
      }

      listEl.innerHTML = htmlFiles.map((file, i) => `
        <div class="item" data-name="${file.name.toLowerCase()}">
          <div class="item-info">
            <div class="item-title">${formatName(file.name)}</div>
            <div class="item-file">${file.name}</div>
          </div>
          <div class="item-controls">
            <select id="h-${i}" title="Hauteur de l'iframe">
              <option value="340">Hauteur : Petit (340px)</option>
              <option value="520" selected>Hauteur : Moyen (520px)</option>
              <option value="620">Hauteur : Grand (620px)</option>
            </select>
            <button type="button" class="btn btn-copy" onclick="copyIframe('${file.name}', 'h-${i}', this)">📋 Copier le code</button>
            <a href="${BASE_URL}${file.name}" target="_blank" class="btn btn-open">👁️ Voir</a>
          </div>
        </div>
      `).join('');
    } catch (e) {
      listEl.innerHTML = '<div class="status">Impossible de charger la liste automatiquement. Vérifiez que le dépôt est public.</div>';
    }
  }

  function copyIframe(filename, selectId, btn) {
    const height = document.getElementById(selectId).value;
    const snippet = `<div style="max-width:750px;margin:24px auto;text-align:center;"><iframe src="${BASE_URL}${filename}" width="100%" height="${height}" frameborder="0"></iframe></div>`;
    navigator.clipboard.writeText(snippet).then(() => {
      const prev = btn.textContent;
      btn.textContent = '✅ Copié !';
      btn.classList.add('ok');
      setTimeout(() => {
        btn.textContent = prev;
        btn.classList.remove('ok');
      }, 1800);
    });
  }

  function filterList() {
    const q = document.getElementById('search').value.toLowerCase();
    document.querySelectorAll('.item').forEach(el => {
      el.style.display = el.dataset.name.includes(q) ? 'flex' : 'none';
    });
  }

  loadFiles();
</script>
</body>
</html>
