<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Le Défi de Biglou – Quiz Chiens &amp; Chats</title>
  <link rel="stylesheet" href="argos-quiz.css" />
</head>
<body>

<div class="quiz-box">
  <div class="header-row">
    <span class="badge">Jeu parents &amp; enfants • Chiens &amp; Chats</span>
    <span class="progress-text" id="progressText">Question 1 / 5</span>
  </div>
  <h2>Sais-tu décoder les chiens et les chats ?</h2>
  <p class="subtitle">Teste tes réflexes en famille en 5 situations concrètes avec Biglou pour devenir un vrai protecteur des animaux !</p>

  <div class="card" id="questionCard">
    <div class="q-header">
      <div class="q-emoji" id="qEmoji">🐶</div>
      <div class="q-title" id="qTitle"></div>
    </div>
    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedbackBox"></div>
    <div class="nav-row">
      <button type="button" class="btn-pill" id="nextBtn" style="display:none;">Question suivante →</button>
    </div>
  </div>

  <div class="card result-box" id="resultBox">
    <div class="score-circle" id="scoreCircle">5/5</div>
    <div class="result-title" id="resultTitle">Champion des chiens et des chats !</div>
    <p class="result-desc" id="resultDesc"></p>
    <button type="button" class="btn-pill" id="restartBtn">↻ Rejouer le quiz</button>
  </div>
</div>

<script>
  const questions = [
    {
      emoji: "🐶",
      question: "Tu caresses un chien et il détourne la tête, bâille et se lèche les babines. Que veut-il te dire ?",
      options: [
        "Qu'il a faim et veut une friandise",
        "« Stop, j'ai besoin d'espace, arrête de me caresser »",
        "Qu'il a très envie de jouer à la balle"
      ],
      correct: 1,
      explanation: "Exact ! Détourner la tête, bâiller ou se lécher les babines sont des signaux d'apaisement : le chien exprime son inconfort bien avant de grogner."
    },
    {
      emoji: "🐱",
      question: "Un chat remue vivement le bout de sa queue, couche les oreilles en arrière et se fige. Comment se sent-il ?",
      options: [
        "Il est très agacé ou stressé : il faut le laisser tranquille",
        "Il est super content comme un chien qui remue la queue",
        "Il réclame un gros câlin dans les bras"
      ],
      correct: 0,
      explanation: "Bravo ! Contrairement au chien, un chat qui fouette l'air avec sa queue et couche ses oreilles montre qu'il est irrité et risque de griffer si on insiste."
    },
    {
      emoji: "🦮",
      question: "Dans la rue, tu croises un chien super mignon tenu en laisse. Quel est le premier réflexe ?",
      options: [
        "Courir vers lui pour lui faire un gros câlin",
        "Le fixer droit dans les yeux en tendant la main",
        "Marcher calmement et demander d'abord la permission à son humain"
      ],
      correct: 2,
      explanation: "Toujours demander l'accord du propriétaire avant d'approcher, sans courir ni fixer le chien dans les yeux."
    },
    {
      emoji: "💤",
      question: "Le chat dort profondément sur l'arbre à chat ou le chien mange dans sa gamelle. Que dois-tu faire ?",
      options: [
        "Les laisser tranquilles : ce sont leurs moments et zones de refuge",
        "Venir les caresser doucement pour leur montrer que tu les aimes",
        "Soulever leur gamelle ou les réveiller pour jouer"
      ],
      correct: 0,
      explanation: "Un chien ou un chat qui mange ou qui dort dans son espace de refuge ne doit jamais être dérangé : il pourrait réagir par surprise ou par défense."
    },
    {
      emoji: "🤚",
      question: "Un chat se roule sur le dos devant toi ou un chien s'approche pour te dire bonjour. Où vaut-il mieux les caresser ?",
      options: [
        "En tapotant fort sur le dessus de leur tête",
        "Doucement avec le plat de la main sous le menton, sur le poitrail ou le côté",
        "En leur attrapant le ventre ou les pattes à deux mains"
      ],
      correct: 1,
      explanation: "Parfait ! La plupart des chiens et des chats n'aiment pas les mains qui arrivent au-dessus de leur tête ni qu'on leur touche le ventre. Préfère toujours une caresse douce sur le flanc, le poitrail ou sous le menton."
    }
  ];

  let current = 0;
  let score = 0;

  const progressText = document.getElementById("progressText");
  const qEmoji = document.getElementById("qEmoji");
  const qTitle = document.getElementById("qTitle");
  const optionsBox = document.getElementById("optionsBox");
  const feedbackBox = document.getElementById("feedbackBox");
  const nextBtn = document.getElementById("nextBtn");
  const questionCard = document.getElementById("questionCard");
  const resultBox = document.getElementById("resultBox");
  const scoreCircle = document.getElementById("scoreCircle");
  const resultTitle = document.getElementById("resultTitle");
  const resultDesc = document.getElementById("resultDesc");
  const restartBtn = document.getElementById("restartBtn");

  function loadQuestion() {
    const q = questions[current];
    progressText.textContent = `Question ${current + 1} / ${questions.length}`;
    qEmoji.textContent = q.emoji;
    qTitle.textContent = q.question;
    optionsBox.innerHTML = "";
    feedbackBox.style.display = "none";
    nextBtn.style.display = "none";

    q.options.forEach((optText, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-btn";
      btn.textContent = optText;
      btn.onclick = () => checkAnswer(idx, btn);
      optionsBox.appendChild(btn);
    });
  }

  function checkAnswer(selectedIdx, clickedBtn) {
    const q = questions[current];
    const buttons = optionsBox.querySelectorAll(".opt-btn");
    buttons.forEach(b => b.disabled = true);

    if (selectedIdx === q.correct) {
      score++;
      clickedBtn.classList.add("correct");
      feedbackBox.innerHTML = `<strong>✅ Bonne réponse !</strong> ${q.explanation}`;
    } else {
      clickedBtn.classList.add("wrong");
      buttons[q.correct].classList.add("correct");
      feedbackBox.innerHTML = `<strong>💡 Pas tout à fait :</strong> ${q.explanation}`;
    }

    feedbackBox.style.display = "block";
    nextBtn.textContent = current < questions.length - 1 ? "Question suivante →" : "Voir mon résultat 🏆";
    nextBtn.style.display = "inline-block";
  }

  nextBtn.onclick = () => {
    current++;
    if (current < questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  };

  function showResult() {
    questionCard.style.display = "none";
    progressText.textContent = "Terminé !";
    resultBox.style.display = "block";
    scoreCircle.textContent = `${score} / ${questions.length}`;

    if (score === questions.length) {
      resultTitle.textContent = "Champion des chiens et des chats !";
      resultDesc.textContent = "Tu sais parfaitement décoder les signaux des chiens et des chats pour vivre avec eux en toute sécurité. Biglou est très fier de toi !";
    } else if (score >= 3) {
      resultTitle.textContent = "Très bons réflexes !";
      resultDesc.textContent = "Tu as déjà compris l'essentiel pour respecter les chiens et les chats. Continue d'observer leurs signaux avec l'aide des aventures de Biglou !";
    } else {
      resultTitle.textContent = "En route vers de nouveaux réflexes !";
      resultDesc.textContent = "Relis les conseils de l'article avec un adulte et découvre les aventures de Biglou le Beagle pour devenir incollable sur les chiens et les chats.";
    }
  }

  restartBtn.onclick = () => {
    current = 0;
    score = 0;
    resultBox.style.display = "none";
    questionCard.style.display = "block";
    loadQuestion();
  };

  loadQuestion();
</script>
</body>
</html>
